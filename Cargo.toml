[package]
name = "cosmic-applet-claude-usage"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
libcosmic = { git = "https://github.com/pop-os/libcosmic", default-features = false, features = ["applet", "applet-token", "tokio", "wayland", "dbus-config"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"

[profile.release]
lto = "thin"
